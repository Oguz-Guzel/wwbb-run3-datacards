plotIt:
  # unitary_bin_width: true
  # plotdefaults:
    # y-axis: "Events / Unit Score"
  configuration:
    width: 800
    height: 800
    margin-left: 0.125
    margin-right: 0.03
    margin-top: 0.05
    margin-bottom: 0.1
    luminosity-label: '%1$.2f fb^{-1} (13.6 TeV)'
    experiment: "CMS"
    extra-label: Work in Progress
    luminosity-error: 0.000001 #doesn't affect the plot, just for drawing the shaded band around the lumi label
    show-overflow: true
    error-fill-style: 3154
    error-fill-color: "#ee556270"
    ratio-fit-error-fill-style: 1001
    ratio-fit-error-fill-color: "#aa556270"
    ratio-fit-line-color: "#0B486B"
    y-axis-format: "%1% / %2$.2f"
    blinded-range-fill-style: 1001
    blinded-range-fill-color: "#29556270"
    yields-table-align: v
    yields-table-text-align: l
    book-keeping-file: plots.root
  plotdefaults:
    y-axis-range: [0.00001, 100000000]
    normalized: False
    y-axis: "Events"
    log-y: both
    y-axis-show-zero: True
    save-extensions: [png]
    show-ratio: True
    sort-by-yields: True
    legend-columns: 4
    ratio-y-axis: "Data / MC"
    ratio-y-axis-range: [0.5, 1.5]
  legend:
    # position: [0.4, 0.55, 0.9, 0.9]
    position:
      - 0.2
      - 0.7
      - 0.9
      - 0.9
    columns: 3

# combineConfigs:

normSyst:
  lumi_13p6TeV_2022:
    val: 0.014
    eras:
      - 2022
      - 2022EE
    group: 
      - TT
      - DY
      - ST
      - VV
      - VJets
      - other
  lumi_13p6TeV_2023:
    val: 0.013
    eras:
      - 2023
      - 2023BPix
    group: 
      - TT
      - DY
      - ST
      - VV
      - VJets
      - other
  QCDscale_ttbar: # not ttbar – ttbar and DY rates are free parameters, see the group names below and footer
    - {val: [1.023, 0.978], group: [ST_tW]}
    - {val: [1.011, 0.992], group: [ST_tchan]}
    - {val: [1.086, 0.905], group: [ttZ]}
    - {val: [1.082, 0.825], group: [tttt]}
  QCDscale_V:
    - {val: [1.012, 0.987], group: [WJets]}
  QCDscale_VV:
    - {val: [1.025, 0.978], group: [WW]}
    - {val: [1.041, 0.968], group: [WZ]}
    - {val: [1.029, 0.973], group: [ZZ]}
  QCDscale_ggH:
    - {val: [1.046, 0.933], group: [ggH]}
  QCDscale_qqH:
    - {val: [1.005, 0.997], group: [VBFH]}
  QCDscale_VH:
    - {val: [1.004, 0.993], group: [WH]}
    - {val: [1.037, 0.968], group: [ZH]}
  QCDscale_ttH:
    - {val: [1.060, 0.907], group: [ttH]}
    - {val: [1.065, 0.852], group: [tHq]}
    - {val: [1.050, 0.932], group: [tHW]}
  pdf_gq:
    - {val: [1.027, 0.973], group: [ST_tW]}
  pdf_gg:
    - {val: [1.067, 0.933], group: [tttt]}
    - {val: [1.035, 0.965], group: [ttZ]}
  pdf_qq:
    - {val: [1.015, 0.991], group: [ST_tchan]}
    - {val: [1.007, 0.993], group: [WJets]}
  pdf_ggH:
    - {val: [1.032, 0.968], group: [ggH]}
  pdf_qqH:
    - {val: [1.021, 0.979], group: [VBFH]}
  pdf_VH:
    - {val: [1.018, 0.982], group: [WH]}
    - {val: [1.016, 0.984], group: [ZH]}
  pdf_ttH:
    - {val: [1.035, 0.965], group: [ttH]}
    - {val: [1.037, 0.963], group: [tHq]}
    - {val: [1.063, 0.937], group: [tHW]}
  BR_hww: # convenience to avoid one very long mixed list of groups
    - {val: [1.0152, 0.9848], group: [ggH, VBFH, WH, ZH, ttH, tHq, tHW]}
    - {val: [1.0152, 0.9848], group: [ggHH_kl_0_kt_1_hbbhww, ggHH_kl_1_kt_1_hbbhww, ggHH_kl_2p45_kt_1_hbbhww, ggHH_kl_5_kt_1_hbbhww, qqHH_CV_1_C2V_1_kl_1_hbbhww, qqHH_CV_1p74_C2V_1p37_kl_14p4_hbbhww, qqHH_CV_m0p962_C2V_0p959_kl_m1p43_hbbhww, qqHH_CV_m0p758_C2V_1p44_kl_m19p3_hbbhww, qqHH_CV_m1p6_C2V_2p72_kl_m1p36_hbbhww, qqHH_CV_m0p012_C2V_0p03_kl_10p2_hbbhww, qqHH_CV_m1p21_C2V_1p94_kl_m0p94_hbbhww, qqHH_CV_m1p83_C2V_3p57_kl_m3p39_hbbhww]}
  BR_hbb:
    - {val: [1.0125, 0.9875], group: [ggHH_kl_0_kt_1_hbbhww, ggHH_kl_1_kt_1_hbbhww, ggHH_kl_2p45_kt_1_hbbhww, ggHH_kl_5_kt_1_hbbhww, qqHH_CV_1_C2V_1_kl_1_hbbhww, qqHH_CV_1p74_C2V_1p37_kl_14p4_hbbhww, qqHH_CV_m0p962_C2V_0p959_kl_m1p43_hbbhww, qqHH_CV_m0p758_C2V_1p44_kl_m19p3_hbbhww, qqHH_CV_m1p6_C2V_2p72_kl_m1p36_hbbhww, qqHH_CV_m0p012_C2V_0p03_kl_10p2_hbbhww, qqHH_CV_m1p21_C2V_1p94_kl_m0p94_hbbhww, qqHH_CV_m1p83_C2V_3p57_kl_m3p39_hbbhww]}
  footer:
    - "rate_ttbar rateParam * TTbar 1 [0,5]"
    - "rate_dy_ggf rateParam * DY 1 [0,5]" # later changed to rate_dy_vbf in the inference script for VBF cards

